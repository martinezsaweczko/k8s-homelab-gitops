---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-crds-helm
      version: "v1.9.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  targetNamespace: envoy-gateway-system
  values:
    crds:
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
