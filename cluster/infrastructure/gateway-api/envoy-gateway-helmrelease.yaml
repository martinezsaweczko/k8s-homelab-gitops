---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-helm
      version: "v1.9.0"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  targetNamespace: envoy-gateway-system
  values:
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
    # Use a LoadBalancer service so MetalLB (installed by Ansible) assigns an external IP.
    service:
      type: LoadBalancer
      loadBalancerIP: 172.26.20.34
