---
# Workaround: cert-manager-webhook-ionos chart binds the domain-solver role to
# the 'cert-manager' service account, but the actual cert-manager deployment uses
# 'cert-manager-cert-manager'. This binding grants the solver permission to the
# correct service account.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-cert-manager-webhook-ionos:domain-solver-cert-manager-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-cert-manager-webhook-ionos:domain-solver
subjects:
  - kind: ServiceAccount
    name: cert-manager-cert-manager
    namespace: cert-manager
