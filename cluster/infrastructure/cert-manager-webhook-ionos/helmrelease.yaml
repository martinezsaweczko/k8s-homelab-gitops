---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ionos
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  chart:
    spec:
      chart: cert-manager-webhook-ionos
      version: "1.3.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ionos
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  targetNamespace: cert-manager
  values:
    namespace: cert-manager
    certManager:
      namespace: cert-manager
    dnsPolicy: None
    dnsConfig:
      nameservers:
        - 1.1.1.1
        - 8.8.8.8
