---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stirling-pdf-internal-https-redirect
  namespace: gateway
spec:
  parentRefs:
    - name: homelab-gateway-internal
      namespace: gateway
      sectionName: http
  hostnames:
    - "pdf.martinez-saweczko.es"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
