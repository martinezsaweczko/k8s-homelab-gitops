apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: notifierwhatsapp
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: k8s-homelab-gitops
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: Flux Bot
        email: flux@martinezsaweczko.com
      messageTemplate: |
        chore: update notifierwhatsapp image to {{ .AutomationObject }}
    push:
      branch: flux-image-updates


