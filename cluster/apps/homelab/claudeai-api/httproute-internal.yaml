---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claudeai-api-internal
  namespace: claudeai-api
spec:
  parentRefs:
    - name: homelab-gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "claudeai.martinez-saweczko.es"
  rules:
    # Only the client-facing paths are exposed. /metrics, /api/v1/skills and
    # /api/v1/skills/refresh are intentionally NOT routed (in-cluster only).
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /api/v1/docs
        - path:
            type: PathPrefix
            value: /docs
        - path:
            type: PathPrefix
            value: /api/v1/health
        - path:
            type: PathPrefix
            value: /api/v1/version
      # LLM calls and SSE streams can last minutes (app default timeout is 5m).
      # Without this, Envoy's default route timeout (15s) would cut them off.
      timeouts:
        request: 10m
      backendRefs:
        - name: claudeai-api
          port: 46564
