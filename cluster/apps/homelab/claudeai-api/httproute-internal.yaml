---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claudeai-api-internal
  namespace: claudeai-api
spec:
  parentRefs:
    - name: homelab-gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "claudeai.martinez-saweczko.es"
  rules:
    # Everything is routed, including /metrics and the skills admin endpoints.
    # They are protected by the app itself: with CLAUDEAI_API_KEYS set, /v1,
    # /metrics and /api/v1/skills* require "Authorization: Bearer <key>"; only
    # health, version and the docs are public. This relies on the key staying
    # non-empty in the Secret: an empty value would disable auth in the app.
    - matches:
        - path:
            type: PathPrefix
            value: /
      # LLM calls and SSE streams can last minutes (app default timeout is 5m).
      # Without this, Envoy's default route timeout (15s) would cut them off.
      timeouts:
        request: 10m
      backendRefs:
        - name: claudeai-api
          port: 46564
