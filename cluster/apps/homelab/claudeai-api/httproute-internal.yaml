---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: claudeai-api-internal
  namespace: claudeai-api
spec:
  parentRefs:
    - name: homelab-gateway-internal
      namespace: gateway
      sectionName: https
  hostnames:
    - "claudeai.martinez-saweczko.es"
  rules:
    # Everything is routed, including /metrics and the skills admin endpoints.
    # The app runs WITHOUT API keys (see deployment.yaml), so all of it is open
    # to whoever can reach this LAN-only hostname.
    - matches:
        - path:
            type: PathPrefix
            value: /
      # LLM calls and SSE streams can last minutes (app default timeout is 5m).
      # Without this, Envoy's default route timeout (15s) would cut them off.
      timeouts:
        request: 10m
      backendRefs:
        - name: claudeai-api
          port: 46564
