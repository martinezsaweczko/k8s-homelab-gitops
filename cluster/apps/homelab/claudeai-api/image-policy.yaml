apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: claudeai-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: claudeai-api
  # The registry also carries the floating tags 0.1, 0 and latest. Flux parses
  # tags leniently ("0.1" == 0.1.0), so they could tie with the real release and
  # pin the Deployment to a mutable tag. Only accept full X.Y.Z tags.
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  policy:
    semver:
      range: ">=0.0.0"
