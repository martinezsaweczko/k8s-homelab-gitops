apiVersion: v1
kind: Service
metadata:
  name: newspaper
  namespace: newspaper
  labels:
    app: newspaper
spec:
  type: ClusterIP
  selector:
    app: newspaper
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
