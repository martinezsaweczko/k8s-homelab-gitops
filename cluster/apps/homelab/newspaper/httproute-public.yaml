---
# Public: kiosko.martinez-saweczko.es is exposed through the public gateway (Google sign-in and
# the public /privacidad and /condiciones pages for the OAuth consent screen).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: newspaper-public
  namespace: newspaper
spec:
  parentRefs:
    - name: homelab-gateway-public
      namespace: gateway
      sectionName: https
  hostnames:
    - "kiosko.martinez-saweczko.es"
  rules:
    # /chat/stream is a Server-Sent Events stream (online status and chat messages) that stays
    # open while a page is open; the app pings it every 20 s. Without this, Envoy's default route
    # timeout (15s) would cut it every 15 s and the browser would reconnect. After an hour the
    # browser reconnects by itself (EventSource), which is harmless.
    - matches:
        - path:
            type: Exact
            value: /chat/stream
      timeouts:
        request: 1h
      backendRefs:
        - name: newspaper
          port: 3000
    - backendRefs:
        - name: newspaper
          port: 3000
