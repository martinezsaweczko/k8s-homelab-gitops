---
# Public: mentorium.martinez-saweczko.es is exposed through the public gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mentorium-studio-public
  namespace: mentorium-studio
spec:
  parentRefs:
    - name: homelab-gateway-public
      namespace: gateway
      sectionName: https
  hostnames:
    - "mentorium.martinez-saweczko.es"
  rules:
    - backendRefs:
        - name: mentorium-studio
          port: 3000
