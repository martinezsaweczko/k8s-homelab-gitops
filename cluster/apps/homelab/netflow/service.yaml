---
# LoadBalancer service exposing the NetFlow collector to the MikroTik routers
# and to Prometheus for metrics scraping.
apiVersion: v1
kind: Service
metadata:
  name: netflow
  namespace: monitoring
  labels:
    app: netflow
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.26.20.36"
spec:
  type: LoadBalancer
  selector:
    app: netflow
  ports:
    - name: netflow
      port: 2055
      targetPort: 2055
      protocol: UDP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
