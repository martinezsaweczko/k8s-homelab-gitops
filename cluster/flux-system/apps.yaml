---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1h
  path: ./cluster/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homelab-gitops
  wait: true
  timeout: 10m
  dependsOn:
    - name: cluster
      namespace: flux-system
    - name: gateway-config
      namespace: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
