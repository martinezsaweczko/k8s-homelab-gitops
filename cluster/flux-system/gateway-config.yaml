---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-config
  namespace: flux-system
spec:
  interval: 1h
  path: ./cluster/infrastructure/gateway-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homelab-gitops
  wait: true
  timeout: 5m
  dependsOn:
    - name: infrastructure
      namespace: flux-system
