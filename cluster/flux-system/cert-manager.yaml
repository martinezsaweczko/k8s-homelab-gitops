---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  path: ./cluster/infrastructure/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: k8s-homelab-gitops
    namespace: flux-system
  wait: true
  timeout: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
