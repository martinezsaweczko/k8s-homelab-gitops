name: Flux Image Update PR

on:
  push:
    branches:
      - flux-image-updates

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the flux-image-updates branch so gh can see it
          git fetch origin flux-image-updates

          # Create PR if it doesn't exist; ignore error if it already exists
          # Use the latest commit message as the PR title/body so it works for
          # any app updated by Flux ImageUpdateAutomation.
          PR_TITLE=$(git log -1 --format=%s origin/flux-image-updates)
          PR_BODY=$(git log -1 --format=%b origin/flux-image-updates)

          gh pr create \
            --base main \
            --head flux-image-updates \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --repo ${{ github.repository }} \
            || true
