name: Flux Image Update PR

on:
  push:
    branches:
      - flux-image-updates

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the flux-image-updates branch so gh can see it
          git fetch origin flux-image-updates

          # Create PR if it doesn't exist; ignore error if it already exists
          gh pr create \
            --base main \
            --head flux-image-updates \
            --title "chore: update notifierwhatsapp image" \
            --body "Automated image update from Flux." \
            --repo ${{ github.repository }} \
            || true
