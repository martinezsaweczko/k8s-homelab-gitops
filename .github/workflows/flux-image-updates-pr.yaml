---
name: Flux Image Updates Auto-PR

on:
  create:
    branches:
      - flux-image-updates

permissions:
  contents: read
  pull-requests: write

jobs:
  pull-request:
    runs-on: ubuntu-latest
    if: github.event.ref_type == 'branch' && github.event.ref == 'flux-image-updates'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo ${{ github.repository }} \
            --head flux-image-updates \
            --base main \
            --title "chore: automated image update" \
            --body "This PR was created automatically by Flux image automation."
